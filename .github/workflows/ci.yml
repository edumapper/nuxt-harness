name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        peers: [latest]
        include:
          # The lowest versions package.json's peerDependencies allow.
          - node: 22
            peers: lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - run: bun install --frozen-lockfile

      - name: Install the lowest peer versions
        if: matrix.peers == 'lowest'
        run: |
          bun add -d eslint@9.24.0 eslint-plugin-vue@10.0.0 vue-eslint-parser@10.0.0 \
            @typescript-eslint/parser@8.12.0 @typescript-eslint/eslint-plugin@8.12.0 typescript@5.5.4

      - run: bun run test

      # The way consumers' agents run it: packed, nothing else installed (npm installs the peers).
      - name: Smoke test packed tarball
        if: matrix.peers == 'latest'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/edumapper-nuxt-harness-*.tgz)"

          # The example app passes the gate as-is.
          cp -r examples/basic "$RUNNER_TEMP/example" && cd "$RUNNER_TEMP/example" && git init -q
          npx --yes --package="$tarball" nuxt-harness fast --all

          # A violation fails it.
          mkdir -p "$RUNNER_TEMP/bad/app/components" && cd "$RUNNER_TEMP/bad" && git init -q
          printf '<script setup lang="ts">\nconst v: any = 1\n</script>\n' > app/components/Bad.vue
          if npx --yes --package="$tarball" nuxt-harness fast --all; then
            echo "::error::fast gate passed on a file with a violation"; exit 1
          fi

          # Installing into a project keeps its own lint toolchain: peers, not pinned dependencies.
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer" && npm init -y >/dev/null
          npm i -D --no-audit --no-fund eslint@latest eslint-plugin-vue@latest vue-eslint-parser@latest \
            @typescript-eslint/parser@latest @typescript-eslint/eslint-plugin@latest typescript@5
          versions() { node -p "['eslint', 'eslint-plugin-vue', 'vue-eslint-parser', '@typescript-eslint/parser'].map(p => require(p + '/package.json').version).join(' ')"; }
          before="$(versions)"
          npm i -D --no-audit --no-fund "$tarball"
          test "$before" = "$(versions)" \
            || { echo "::error::installing the harness changed the project's lint packages: $before -> $(versions)"; exit 1; }
          test ! -d node_modules/@edumapper/nuxt-harness/node_modules \
            || { echo "::error::the harness installed private copies:"; ls node_modules/@edumapper/nuxt-harness/node_modules; exit 1; }
